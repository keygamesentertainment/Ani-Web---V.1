<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Ani Web</title><style>

:root{
  --bg:#0b0d12;--panel:#121621;--panel2:#171c29;--text:#f6f7fb;--muted:#98a2b3;
  --accent:#8b5cf6;--accent2:#a78bfa;--line:#252b3a;--good:#22c55e;--warn:#f59e0b;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0a0c11,#10131b 55%,#0b0d12);color:var(--text);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}
.topbar{height:64px;display:flex;align-items:center;gap:24px;padding:0 28px;border-bottom:1px solid var(--line);
background:rgba(10,12,17,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:21px}.brand span{color:var(--accent2)}
.nav{display:flex;gap:8px;flex:1}
.nav a,.dropbtn{padding:9px 12px;border-radius:10px;color:#c6cada;font-size:14px}
.nav a:hover,.nav a.active,.dropbtn:hover{background:#1a2030;color:#fff}
.dropdown{position:relative}.dropdown-content{display:none;position:absolute;top:40px;left:0;min-width:180px;background:#151a26;
border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.dropdown:hover .dropdown-content{display:block}.dropdown-content a{display:block;padding:9px 10px}
.search{background:#121722;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:#fff;width:220px}
.page{max-width:1280px;margin:auto;padding:28px}
.hero{min-height:280px;border-radius:22px;overflow:hidden;position:relative;display:flex;align-items:end;padding:32px;
background:
linear-gradient(90deg,rgba(8,10,15,.95) 0%,rgba(8,10,15,.72) 42%,rgba(8,10,15,.28) 74%,rgba(8,10,15,.6) 100%),
radial-gradient(circle at 80% 20%,#7c3aed55,transparent 34%),
linear-gradient(135deg,#232943,#131725 48%,#241734);}
.hero:before{content:"";position:absolute;inset:0;background:
radial-gradient(circle at 70% 44%,rgba(167,139,250,.23),transparent 23%),
linear-gradient(135deg,transparent 45%,rgba(236,72,153,.12) 46%,transparent 65%)}
.hero-copy{position:relative;max-width:650px}.eyebrow{color:var(--accent2);font-weight:700;letter-spacing:.08em;font-size:12px;text-transform:uppercase}
h1{font-size:46px;margin:8px 0 10px}h2{font-size:24px;margin:26px 0 14px}p{color:var(--muted);line-height:1.6}
.btn{display:inline-block;padding:11px 16px;border-radius:11px;background:var(--accent);font-weight:700;border:0;color:white}
.btn.secondary{background:#1a2030}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.stat strong{font-size:26px;display:block}
.section-head{display:flex;justify-content:space-between;align-items:center}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.chip{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#121722;color:#cfd4df;font-size:13px}
.chip.active{background:#2b2149;border-color:#6d4fd8;color:#fff}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.18s transform,.18s border-color}
.card:hover{transform:translateY(-3px);border-color:#5f4aa8}.poster{aspect-ratio:2/3;background:linear-gradient(150deg,#373f5f,#171c29 50%,#4c1d5b);
display:flex;align-items:flex-end;padding:14px;font-weight:800;font-size:18px}.poster.alt1{background:linear-gradient(145deg,#193b49,#111827 48%,#1e3a8a)}
.poster.alt2{background:linear-gradient(145deg,#4a1d3f,#171124 46%,#8b1e3f)}
.poster.alt3{background:linear-gradient(145deg,#32452a,#111827 55%,#654321)}
.poster.alt4{background:linear-gradient(145deg,#35224b,#111827 50%,#123d55)}
.poster.alt5{background:linear-gradient(145deg,#51351f,#111827 54%,#40203a)}
.card-body{padding:12px}.card-title{font-weight:700;font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:5px}
.layout2{display:grid;grid-template-columns:1fr 320px;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.schedule-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:
radial-gradient(circle at 20% 10%,#7c3aed33,transparent 30%),radial-gradient(circle at 85% 80%,#db277733,transparent 26%),#090b10}
.login-card{width:min(430px,100%);background:rgba(18,22,33,.95);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login-card h1{font-size:34px}.field{width:100%;padding:13px 14px;margin:8px 0 14px;border-radius:11px;border:1px solid var(--line);background:#0f131c;color:#fff}
.login-card .btn{width:100%;cursor:pointer}
.detail{display:grid;grid-template-columns:250px 1fr 320px;gap:24px}.detail-poster{aspect-ratio:2/3;border-radius:18px;background:linear-gradient(155deg,#334155,#151827 50%,#5b21b6);
display:flex;align-items:end;padding:18px;font-size:24px;font-weight:800}.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px;margin:16px 0}
.kv div:nth-child(odd){color:var(--muted)}.progress{height:8px;background:#242938;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;width:66%;background:var(--accent)}
.manga-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}.manga .card-body{display:flex;flex-direction:column;gap:10px}.readbtn{text-align:center;background:var(--accent);padding:9px;border-radius:9px;font-weight:700}
@media(max-width:900px){.nav{overflow:auto}.search{display:none}.grid,.manga-grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.layout2,.detail{grid-template-columns:1fr}.detail-poster{max-width:260px}.topbar{padding:0 14px;gap:12px}.page{padding:18px}h1{font-size:36px}}
@media(max-width:560px){.grid,.manga-grid{grid-template-columns:repeat(2,1fr)}.nav a,.dropbtn{padding:8px 9px;font-size:13px}.hero{min-height:230px;padding:22px}}

</style></head><body>
<div class="login-wrap"><div class="login-card">
<div class="eyebrow">Private Library</div><h1>Ani <span style="color:#a78bfa">Web</span></h1>
<p>Your personal anime and manga library.</p>
<label>Username</label><input class="field" value="KeyGames">
<label>Password</label><input class="field" type="password" value="password">
<button class="btn" type="button" onclick="window.location.href='dashboard.html'">Log In</button>
<p style="font-size:12px;text-align:center;margin-top:16px">Prototype login — Supabase Auth will replace this.</p>
</div></div></body></html>
